[workspace]
resolver = "2"
members = ["src/platform", "src/engine-sys", "src/engine", "src/protocol", "src/workspace",
           "src/launcher", "src/config", "src/daemon", "src/frontend", "src/browser-api", "src/browser"]

[workspace.package]
# Product version for every executable and module.
version = "0.9.3"
edition = "2021"
publish = false

[workspace.lints.clippy]
# Functions and types at the C boundary mirror C signatures; splitting them adds indirection, not clarity.
too_many_arguments = "allow"
type_complexity = "allow"
# New functions stay within 100 lines; existing exceptions carry #[expect] with a reason.
too_many_lines = "warn"

[workspace.dependencies]
bindgen = { version = "0.72", default-features = false, features = ["runtime"] }
libc = "0.2"
gtk = "0.18"
glib = "0.18"
glib-sys = "0.18"
pango = "0.18"
cairo-rs = "0.18"
webkit2gtk = { version = "2", features = ["v2_40"] }
